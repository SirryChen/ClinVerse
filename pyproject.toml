[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinverse"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "icd-mappings>=0.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "adapters*",
    "pipeline*",
    "providers*",
    "agents*",
    "simulation*",
    "evaluation*",
    "env*",
    "doctor_train*",
    "examples*",
    "preprocessing*",
]
