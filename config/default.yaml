llm_providers:
  patient:
    api_key: ${CLINVERSE_PATIENT_API_KEY:-EMPTY}
    base_url: ${CLINVERSE_PATIENT_BASE_URL:-http://localhost:8000/v1}
    patient_actor_model: ${CLINVERSE_PATIENT_MODEL:-Qwen3-32B}
    doctor_model: ${CLINVERSE_PATIENT_MODEL:-Qwen3-32B}
    timeout: 180
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  doctor:
    api_key: ${CLINVERSE_DOCTOR_API_KEY:-EMPTY}
    base_url: ${CLINVERSE_DOCTOR_BASE_URL:-http://localhost:8000/v1}
    patient_actor_model: ${CLINVERSE_DOCTOR_MODEL:-Qwen3-32B}
    doctor_model: ${CLINVERSE_DOCTOR_MODEL:-Qwen3-32B}
    timeout: 180
  lab:
    api_key: ${CLINVERSE_LAB_API_KEY:-EMPTY}
    base_url: ${CLINVERSE_LAB_BASE_URL:-http://localhost:8001/v1}
    lab_model: ${CLINVERSE_LAB_MODEL:-ClinLab-2B}
    patient_actor_model: ${CLINVERSE_LAB_MODEL:-ClinLab-2B}
    doctor_model: ${CLINVERSE_LAB_MODEL:-ClinLab-2B}
    timeout: 180
  extractor:
    api_key: ${CLINVERSE_EXTRACTOR_API_KEY:-EMPTY}
    base_url: ${CLINVERSE_EXTRACTOR_BASE_URL:-http://localhost:8000/v1}
    info_extractor_model: ${CLINVERSE_EXTRACTOR_MODEL:-Qwen3-32B}
    doctor_model: ${CLINVERSE_EXTRACTOR_MODEL:-Qwen3-32B}
    timeout: 180
  embedding:
    api_key: ${CLINVERSE_EMBEDDING_API_KEY:-EMPTY}
    base_url: ${CLINVERSE_EMBEDDING_BASE_URL:-http://localhost:8002/v1}
    embedding_model: ${CLINVERSE_EMBEDDING_MODEL:-BAAI/bge-m3}
    timeout: 180
paths:
  cases: data/cases
  eval_results: outputs/evaluation
  synthea_root: ../synthea
datasets:
  mimic-iv-ext:
    data_dir: data/normalized/mimic-iv-ext
  sicdb-ext:
    data_dir: data/normalized/sicdb-ext
default_dataset: mimic-iv-ext
default_llm_provider: patient
default_patient_provider: patient
default_doctor_provider: doctor
default_lab_provider: lab
simulation:
  max_turns: 20
  language: en
pipeline:
  top_k: 3
scoring:
  diagnosis_subweights:
    category: 0.5
    subtype: 0.5
